<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <meta
      name="description"
      content="Analog Frame — Lean browser-side framing and EXIF typography for scanned film photos on Instagram."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Analog Frame — Film Framing for Instagram</title>
    <!-- Google tag (gtag.js) with Consent Mode v2 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      window.gtag = gtag;

      var storedConsent = null;
      try {
        storedConsent = localStorage.getItem('analog_frame_cookie_consent_v1');
      } catch (e) {}
      if (!storedConsent && typeof document !== 'undefined' && document.cookie) {
        if (document.cookie.indexOf('analog_frame_consent=accepted') !== -1) {
          storedConsent = 'accepted';
        }
      }

      var isLocalHost =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        location.hostname === '[::1]';

      gtag('consent', 'default', {
        analytics_storage: storedConsent === 'accepted' ? 'granted' : 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500,
      });

      gtag('js', new Date());
      if (!isLocalHost) {
        gtag('config', 'G-M9GZQSXXPH', { send_page_view: true });
      }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M9GZQSXXPH"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
